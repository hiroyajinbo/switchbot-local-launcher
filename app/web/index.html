<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SwitchBot Local Launcher</title>
    <link rel="stylesheet" href="/static/style.css?v=mvp3-ui-1" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <h1>SwitchBot</h1>
        <div class="header-actions">
          <button id="themeButton" class="icon-button" type="button" aria-label="ダークモードに切り替え">🌙</button>
          <button id="editModeButton" class="icon-button" type="button">編集</button>
          <div id="statusBadge" class="status-badge">起動確認中</div>
        </div>
      </header>

      <section class="status-panel" aria-label="状態">
        <div class="section-heading">
          <h2>環境</h2>
          <button id="refreshStatusButton" class="icon-button" type="button" title="状態を更新">
            更新
          </button>
        </div>
        <div id="environmentList" class="environment-list">
          <div class="empty-text">取得待ちです。</div>
        </div>
        <div id="statusCheckedAt" class="checked-at"></div>
      </section>

      <section class="scene-panel" aria-label="シーン">
        <div class="section-heading"><h2>クイック操作</h2></div>
        <div id="buttonList" class="action-groups"></div>
      </section>

      <section class="device-panel primary-panel" aria-label="デバイス状態">
        <div class="section-heading">
          <h2>デバイス</h2>
          <div class="room-creator">
            <input id="newRoomName" type="text" placeholder="新しい部屋" />
            <button id="addRoomButton" class="icon-button" type="button">部屋を追加</button>
          </div>
        </div>
        <div id="deviceStatusList" class="device-status-list">
          <div class="empty-text">取得待ちです。</div>
        </div>
      </section>

      <section class="config-panel" aria-label="設定更新">
        <div class="section-heading">
          <h2>機器・シーン設定</h2>
          <button id="refreshCandidatesButton" class="icon-button" type="button">最新候補を取得</button>
        </div>
        <div id="candidateList" class="candidate-list">
          <div class="empty-text">必要なときだけ最新候補を取得してください。</div>
        </div>
        <button id="applyCandidatesButton" class="apply-button" type="button" disabled>選択項目を設定へ追加</button>
        <div id="staleList" class="candidate-list stale-list"></div>
        <button id="removeStaleButton" class="danger-button" type="button" disabled>選択した存在しない設定を削除</button>
        <div id="configMessage" class="checked-at"></div>
        <div class="desktop-settings">
          <div>
            <h3>PCアプリ</h3>
            <div id="desktopLogPath" class="checked-at"></div>
          </div>
          <label class="desktop-autostart">
            <input id="desktopAutostart" type="checkbox" />
            Windowsログイン時に自動起動
          </label>
          <button id="openLogsButton" class="icon-button" type="button">ログフォルダを開く</button>
        </div>
      </section>

      <section class="result legacy-result" aria-live="polite">
        <div class="result-label">最終実行</div>
        <div id="resultMessage" class="result-message">まだ実行していません。</div>
        <div id="resultTime" class="result-time"></div>
      </section>

      <details class="history-panel" aria-label="実行履歴">
        <summary>最近の実行 <span id="historyCount">0件</span></summary>
        <ol id="historyList" class="history-list">
          <li class="empty-text">まだ実行していません。</li>
        </ol>
      </details>

      <section class="device-panel" aria-label="赤外線リモコン">
        <div class="section-heading">
          <h2>赤外線リモコン</h2>
        </div>
        <div id="remoteList" class="device-status-list">
          <div class="empty-text">取得待ちです。</div>
        </div>
      </section>
    </main>
    <div id="toastRegion" class="toast-region" aria-live="polite"></div>

    <script src="/static/app.js?v=mvp3-remote-quick-3"></script>
  </body>
</html>
