[project]
name = "switchbot-local-launcher"
version = "0.1.0"
description = "Local browser launcher for SwitchBot devices and scenes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]
desktop = [
  "pywebview>=6.1",
  "pyinstaller>=6.0",
  "pywinauto>=0.6.9",
]

[project.scripts]
switchbot-local-launcher = "app.main:run"
switchbot-local-launcher-desktop = "app.desktop:run"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*"]
